<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NXT Basketball</title>
<style>
:root{
  --bg:#0e1116; --panel:#161a22; --panel2:#1e2330; --line:#2b3242; --ink:#eef1f6; --muted:#9aa4b5;
  --accent:#22c55e; --accent-ink:#06210f; --gold:#facc15; --danger:#ef4444; --orange:#f97316;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){ --bg:#f2f4f7; --panel:#ffffff; --panel2:#eef1f5; --line:#d9dee7; --ink:#10151d; --muted:#5b6575; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
[hidden]{display:none!important}
header{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;letter-spacing:.06em;font-size:20px}
.brand b{background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:2px 8px}
.brand span{font-weight:600;font-size:13px;color:var(--muted);letter-spacing:.02em}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button,.seg a{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-weight:700;font-size:13px;color:var(--muted);text-decoration:none}
.seg [aria-pressed="true"],.seg [aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:7px 12px;font-weight:700;font-size:13px}
.app{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;padding:16px;max-width:1500px;margin:0 auto}
@media (max-width:900px){.app{grid-template-columns:1fr;padding:12px}}
@media (max-width:560px){header{gap:8px 10px;padding:8px 12px}.brand span{display:none}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.panel + .panel{margin-top:14px}
.panel h2{margin:0 0 10px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:9px 10px;font-weight:650}
.item[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.item .n{font-size:11px;font-weight:800;border-radius:999px;padding:2px 7px;background:var(--line)}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.titlebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.titlebar h1{margin:0;font-size:20px;flex:1;min-width:180px}
.tag{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:2px 8px;background:var(--line)}
.tag.O{background:#1d4ed8;color:#fff}.tag.D{background:#b91c1c;color:#fff}
.fieldwrap{position:relative;background:#e9dcc2;display:flex;justify-content:center;touch-action:manipulation}
svg#court{display:block;width:100%;height:auto;max-height:74vh;user-select:none}
.ov-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:84px;height:84px;border-radius:50%;border:0;background:rgba(0,0,0,.5);color:#fff;font-size:36px;padding-left:6px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(0,0,0,.35)}
.ov-fs{position:absolute;right:10px;bottom:10px;width:48px;height:48px;border-radius:12px;border:0;background:rgba(0,0,0,.5);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center}
.stepnow{position:absolute;left:10px;right:66px;bottom:10px;background:rgba(0,0,0,.62);color:#fff;border-radius:10px;padding:7px 11px;font-size:14px;font-weight:600;pointer-events:none}
.stepnow b{color:var(--gold)}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.play{width:46px;height:46px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:18px;font-weight:900}
.controls input[type=range]{flex:1;min-width:140px;accent-color:var(--accent);height:28px}
.time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;min-width:86px;text-align:right}
.fsnav{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:transparent;font-size:24px;line-height:1}
.details{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;padding:14px;border-top:1px solid var(--line)}
.box{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
.box h3{margin:0 0 8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.steps button{display:flex;gap:10px;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:8px;padding:6px 8px}
.steps button i{font-style:normal;font-weight:900;min-width:20px;height:20px;border-radius:50%;background:var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.steps button[aria-current="true"]{background:var(--panel);border-color:var(--accent)}
.steps button[aria-current="true"] i{background:var(--accent);color:var(--accent-ink)}
.key{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.key svg{vertical-align:middle}
/* full screen: just the court and the controls */
body.fs{overflow:hidden}
body.fs .stage{position:fixed;inset:0;z-index:60;border:0;border-radius:0;display:flex;flex-direction:column;background:#1b120b;color:#fff}
body.fs .details,body.fs #scrub,body.fs #time,body.fs .ov-fs,body.fs .titlebar .tag{display:none}
body.fs .titlebar{padding:6px 10px;border:0}
body.fs .titlebar h1{font-size:17px}
body.fs .fieldwrap{flex:1;min-height:0;align-items:center;touch-action:none}
body.fs svg#court{width:100%;height:100%;max-height:none}
body.fs .controls{justify-content:center;border:0;padding:6px 10px calc(6px + env(safe-area-inset-bottom))}
body.fs .controls .btn,body.fs .fsnav{background:transparent;color:#fff;border:1px solid #ffffff55;min-width:46px;height:46px;border-radius:23px}
#btn-fsclose{display:none}
body.fs #btn-fsclose{display:inline-flex;align-items:center;justify-content:center;background:transparent;color:#fff;border:1px solid #ffffff55;width:46px;height:46px;border-radius:23px}
body:not(.fs) .fsnav{display:none}
@media (orientation:landscape) and (max-height:520px){body.fs .controls{position:absolute;right:8px;bottom:8px;padding:0;gap:8px}body.fs .stepnow{right:330px}}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
textarea{width:100%;min-height:70px;resize:vertical}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:8px}
.panel h2{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sync{font-size:12px;font-weight:700;color:var(--muted);margin-left:auto}
.sync[data-tone="ok"]{color:var(--accent)}.sync[data-tone="warn"]{color:#f59e0b}
.editbar{display:flex;flex-direction:column;gap:8px;padding:10px 14px;background:color-mix(in srgb,var(--gold) 14%,var(--panel));border-bottom:1px solid var(--line)}
.erow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.erow .seg button{padding:6px 11px}
#say{flex:1;min-width:200px}
.ehint{font-size:13px;color:var(--muted);margin:0}
.title-in{flex:1;min-width:180px;font-size:18px;font-weight:800}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0}
.row label{font-size:13px;color:var(--muted);min-width:70px}
body.editing svg#court{touch-action:none}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--ink);padding:0;width:min(560px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dlg-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.dlg-h h2{margin:0;font-size:18px}
.dlg-b{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;padding:0 16px 16px}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;cursor:pointer;font-weight:700}
.drop img{max-width:100%;max-height:220px;border-radius:8px}
.drop small{font-weight:500;color:var(--muted)}
.impmsg{margin:0;font-size:14px;font-weight:600}
.impmsg.err{color:var(--danger)}
.impmsg.busy::before{content:"";display:inline-block;width:14px;height:14px;margin-right:8px;vertical-align:-2px;border:2px solid var(--muted);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <div class="brand"><b>NXT</b><span>Basketball</span></div>
  <nav class="seg" aria-label="Sport"><a href="index.html">🏈 Football</a><a href="hoops.html" aria-current="page">🏀 Basketball</a></nav>
  <span class="sync" id="sync"></span>
</header>
<div class="app">
  <aside>
    <section class="panel">
      <h2>Side</h2>
      <div class="seg" id="side" role="group" aria-label="Offense or defense"><button data-v="O">Offense</button><button data-v="D">Defense</button></div>
      <h2 style="margin-top:14px">Packages <button class="btn sm" id="btn-newpkg">+ New</button></h2>
      <div class="chips" id="pkgs"></div>
    </section>
    <section class="panel">
      <h2>Plays <span style="display:flex;gap:6px"><button class="btn sm" id="btn-import" title="Turn a photo of a play (or a description) into an animated play">📷 Import</button><button class="btn sm primary" id="btn-new">+ New play</button></span></h2>
      <div class="list" id="plays"></div>
    </section>
  </aside>
  <main class="stage">
    <div class="titlebar">
      <h1 id="title">Pick a play</h1>
      <input class="title-in" id="title-in" hidden aria-label="Play name">
      <span id="tags"></span>
      <button class="btn" id="btn-edit" hidden>Edit</button>
      <button id="btn-fsclose" aria-label="Close full screen">✕</button>
    </div>
    <div class="editbar" id="editbar" hidden>
      <div class="erow"><div class="seg" id="stepbar" role="group" aria-label="Steps"></div><button class="btn sm" id="btn-addstep">+ Step</button><span style="flex:1"></span><button class="btn sm" id="btn-undo" disabled>↶ Undo</button><button class="btn sm primary" id="btn-done">Done</button></div>
      <div class="erow" id="toolrow"></div>
      <div class="erow" id="sayrow"><input id="say" placeholder="What happens in this step (shows on the court)" aria-label="What happens in this step"></div>
      <p class="ehint" id="ehint"></p>
    </div>
    <div class="fieldwrap" id="fieldwrap">
      <svg id="court" viewBox="-28 -4 56 58" role="img" aria-label="Basketball half court with the play"></svg>
      <button class="ov-play" id="ov-play" aria-label="Play">▶</button>
      <button class="ov-fs" id="btn-fs" aria-label="Full screen" title="Full screen. Turn the tablet sideways to make it bigger.">⛶</button>
      <div class="stepnow" id="stepnow" hidden></div>
    </div>
    <div class="controls">
      <button class="fsnav" id="btn-prev" aria-label="Previous play">‹</button>
      <button class="play" id="btn-play" aria-label="Play">▶</button>
      <button class="btn" id="btn-rate">1×</button>
      <button class="btn" id="btn-restart" aria-label="Back to the start">⟲</button>
      <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Play progress">
      <span class="time" id="time">0.0s</span>
      <button class="fsnav" id="btn-next" aria-label="Next play">›</button>
    </div>
    <div class="details" id="details"></div>
  </main>
</div>
<dialog id="impdlg" aria-labelledby="imp-h">
  <div class="dlg-h"><h2 id="imp-h">Import a play</h2><button class="btn sm" id="imp-x" aria-label="Close">✕</button></div>
  <div class="dlg-b">
    <p class="ehint" style="font-size:14px">Snap a photo of a play (whiteboard, clipboard, a playbook page) or type it out. Claude puts it on the court and animates it. You can fix anything afterward with Edit.</p>
    <label class="drop" id="imp-drop"><input type="file" id="imp-file" accept="image/*" hidden><span id="imp-pick">📷 Take or choose a photo</span><small id="imp-sub">Numbers for our players, X's for defenders</small><img id="imp-img" alt="" hidden></label>
    <textarea id="imp-text" placeholder="And/or describe it: “5 out. 1 passes to 2 and cuts to the basket. 5 screens for 3, 3 curls to the elbow, 2 hits 3 for the shot.”" aria-label="Describe the play"></textarea>
    <p class="impmsg" id="imp-msg" aria-live="polite"></p>
  </div>
  <div class="dlg-f"><button class="btn" id="imp-cancel">Cancel</button><button class="btn primary" id="imp-go">✨ Bring it to life</button></div>
</dialog>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

// ---------------------------------------------------------------- the court (feet). Baseline at y = 0 (top), half court at y = 47.
const RIM = [0, 5.25];
// moves: cut (solid arrow), drib (zig-zag), screen (ends in a bar), slide (defense, red)
const cut = (...pts) => ({ k: "cut", pts }), drib = (...pts) => ({ k: "drib", pts }), scr = (...pts) => ({ k: "screen", pts }), sl = (...pts) => ({ k: "slide", pts });

const DEFAULT_PKGS = {
  O: [{ id: "mo", name: "Man offense" }, { id: "zo", name: "Zone offense" }, { id: "in", name: "Inbounds" }],
  D: [{ id: "man", name: "Man" }, { id: "zone", name: "1-2-2 Trap" }],
};

// 4 out, 1 in
const FOUR_OUT = { O1: [0, 27], O2: [16, 21], O3: [-16, 21], O4: [-21, 4], O5: [6, 8] };

const DEFAULT_PLAYS = [
  // ------------------------------------------------ Man offense
  { id: "giveandgo", name: "Give & Go", side: "O", pkg: "mo", ball: "O1",
    at: { O1: [0, 27], O2: [16, 21], O3: [-16, 21], O4: [21, 4], O5: [-6, 8] },
    notes: "Pass and cut. The second you pass, fake one way and cut hard to the basket with your hand up. 5 stays on the other block so the lane is open.",
    beats: [
      { say: "1 passes to 2 on the wing.", pass: "O2", m: { O2: cut([17, 22]) } },
      { say: "1 fakes left, then cuts hard to the basket (the “go”).", m: { O1: cut([-3, 25], [2, 13], [2, 8]) } },
      { say: "2 hits 1 with a bounce pass. 3 fills the top.", pass: "O1", m: { O1: cut([1.5, 6.8]), O3: cut([-3, 26]) } },
      { say: "Layup!", shot: true, label: "SCORE!" },
    ] },
  { id: "pnr", name: "Pick & Roll", side: "O", pkg: "mo", ball: "O1",
    at: { O1: [0, 28], O2: [17, 21], O3: [-17, 21], O4: [-21, 4], O5: [6, 10] },
    notes: "5 sets the screen on 1's defender and holds still. 1 waits for the screen, then goes shoulder to shoulder off it. 5 rolls to the rim with his hands up.",
    beats: [
      { say: "5 comes up and sets a screen on 1's defender.", m: { O5: scr([2.4, 26.4]) } },
      { say: "1 dribbles right off the screen. 5 rolls to the basket. 2 slides to the corner to make room.", m: { O1: drib([5, 25], [9, 19.5]), O5: cut([3, 18], [2, 9]), O2: cut([21, 6]) } },
      { say: "1 hits 5 rolling to the rim.", pass: "O5", m: { O5: cut([1.5, 7]) } },
      { say: "Layup! (If 5 is covered, 1 pulls up and shoots.)", shot: true, label: "SCORE!" },
    ] },
  { id: "backdoor", name: "Backdoor", side: "O", pkg: "mo", ball: "O1",
    at: { O1: [0, 27], O2: [16, 21], O3: [-16, 21], O4: [-21, 4], O5: [-6, 8] },
    notes: "Use it when 2's defender is overplaying the pass. Walk him up, then plant and go behind him. Bounce pass to the cutter.",
    beats: [
      { say: "2's defender is overplaying. 2 walks him up toward half court.", m: { O2: cut([19, 26]) } },
      { say: "2 plants his outside foot and cuts backdoor to the basket.", m: { O2: cut([14, 18], [4, 8]) } },
      { say: "1 throws the bounce pass.", pass: "O2", m: { O2: cut([2, 6.8]) } },
      { say: "Layup!", shot: true, label: "SCORE!" },
    ] },
  { id: "screenaway", name: "Screen Away", side: "O", pkg: "mo", ball: "O1",
    at: { O1: [0, 27], O2: [16, 21], O3: [-16, 21], O4: [-21, 4], O5: [6, 8] },
    notes: "Pass one way, screen the other way. 2 waits for the screen, then comes off it tight to the top for the shot.",
    beats: [
      { say: "1 passes to 3.", pass: "O3" },
      { say: "1 goes away from the ball and screens for 2.", m: { O1: scr([12.5, 23]) } },
      { say: "2 comes off the screen to the top. 1 steps back out to the wing.", m: { O2: cut([10, 25], [1, 27]), O1: cut([17, 21]) } },
      { say: "3 passes to 2.", pass: "O2" },
      { say: "Shot!", shot: true, label: "SCORE!" },
    ] },
  { id: "drivekick", name: "Drive & Kick", side: "O", pkg: "mo", ball: "O1",
    at: { O1: [0, 27], O2: [16, 21], O3: [-16, 21], O4: [21, 4], O5: [-6, 8] },
    notes: "Attack the gap. When a second defender comes to stop you, kick it to the open man. Corner shooters: stay wide and have your hands ready.",
    beats: [
      { say: "1 drives hard into the lane.", m: { O1: drib([4, 20], [5, 13]) } },
      { say: "4's defender helps to stop him. 1 kicks it out to 4 in the corner.", pass: "O4", m: { O1: cut([4, 12]) } },
      { say: "Shoot the corner shot!", shot: true, label: "SCORE!" },
    ] },

  // ------------------------------------------------ Zone offense
  { id: "zskip", name: "Overload & Skip", side: "O", pkg: "zo", ball: "O1",
    at: { O1: [0, 28], O2: [17, 20], O3: [-17, 20], O4: [21, 4], O5: [9, 11] },
    notes: "Put three on one side so the zone runs over there, then skip it over the top to the other side. Skip passes are two-hand overhead passes.",
    beats: [
      { say: "1 passes to 2 on the wing. The zone shifts to the ball.", pass: "O2" },
      { say: "2 swings it to 4 in the corner. Everyone in the zone runs to that side.", pass: "O4", m: { O3: cut([-18, 15]) } },
      { say: "4 passes back to 2.", pass: "O2" },
      { say: "2 skips it over the top to 3 on the far side.", pass: "O3", lob: true },
      { say: "Wide open shot!", shot: true, label: "SCORE!" },
    ] },
  { id: "zflash", name: "High Post Flash", side: "O", pkg: "zo", ball: "O1",
    at: { O1: [0, 28], O2: [18, 19], O3: [-18, 19], O4: [12, 4], O5: [-6, 7] },
    notes: "The middle of the zone is the hole. 5 flashes to the free-throw line, catches, and turns to look at the basket right away.",
    beats: [
      { say: "1 passes to 2 on the wing.", pass: "O2" },
      { say: "5 flashes into the middle of the zone, at the free-throw line.", m: { O5: cut([-4, 13], [0, 18]) } },
      { say: "2 hits 5 in the middle. 4 sneaks in along the baseline.", pass: "O5", m: { O4: cut([8, 5]) } },
      { say: "5 turns and finds 4 cutting to the rim (or shoots it).", pass: "O4", m: { O4: cut([2, 6]) } },
      { say: "Layup!", shot: true, label: "SCORE!" },
    ] },

  // ------------------------------------------------ Inbounds
  { id: "box", name: "Box (under our basket)", side: "O", pkg: "in", ball: "O1",
    at: { O1: [5, -1.5], O4: [-6, 8], O5: [6, 8], O2: [-6, 19], O3: [6, 19] },
    notes: "Line up in a box. Go on 1's slap of the ball. Look for 4 first, then 3 in the corner, then 2 at the top to be safe.",
    beats: [
      { say: "On the slap: 5 screens across for 4. 3 pops to the corner, 2 goes to the top.", m: { O5: scr([-4, 7.5]), O4: cut([-6, 11], [-1, 10.5], [3, 6]), O3: cut([13, 12], [20, 4]), O2: cut([0, 25]) } },
      { say: "1 passes to 4 cutting to the basket.", pass: "O4", m: { O4: cut([2, 6]) } },
      { say: "Layup!", shot: true, label: "SCORE!" },
    ] },

  // ------------------------------------------------ Man defense
  { id: "jump", name: "Jump to the Ball", side: "D", pkg: "man", ball: "O1",
    at: { ...FOUR_OUT, X1: [0, 24.5], X2: [13, 19], X3: [-13, 19], X4: [-12, 8], X5: [5, 10] },

// ---------------------------------------------------------------- timing
const BEAT = 1.35, HOLD = 0.7;
let BEAT_NOW = BEAT;
const beatDur = (b) => b.dur || BEAT_NOW;
function starts(p) { BEAT_NOW = p.beat || BEAT; const s = []; let t = 0; for (const b of p.beats) { s.push(t); t += beatDur(b); } return s; }
const duration = (p) => (BEAT_NOW = p.beat || BEAT, 0) + p.beats.reduce((a, b) => a + beatDur(b), 0) + HOLD;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = (f) => (f < 0.5 ? 2 * f * f : 1 - Math.pow(-2 * f + 2, 2) / 2);
const lerp = (a, b, f) => [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f];
function along(pts, f) {
  const seg = []; let tot = 0;
  for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); tot += d; }
  if (!tot) return pts[pts.length - 1];
  let want = f * tot;
  for (let i = 0; i < seg.length; i++) { if (want <= seg[i] || i === seg.length - 1) return lerp(pts[i], pts[i + 1], seg[i] ? clamp(want / seg[i]) : 1); want -= seg[i]; }
  return pts[pts.length - 1];
}
/** Where a player is at time t. */
function posAt(p, id, t) {
  let at = p.at[id]; const s = starts(p);
  for (let i = 0; i < p.beats.length; i++) {
    if (t <= s[i]) return at;
    const m = p.beats[i].m?.[id]; if (!m) continue;
    const f = clamp((t - s[i]) / beatDur(p.beats[i]));
    if (f < 1) return along([at, ...m.pts], ease(f));
    at = m.pts[m.pts.length - 1];
  }
  return at;
}
/** The ball at time t: { xy, holder, flying, lift, shot } */
function ballAt(p, t) {
  let holder = p.ball; const s = starts(p);
  for (let i = 0; i < p.beats.length; i++) {
    const b = p.beats[i]; if (t < s[i]) break;
    const f = clamp((t - s[i]) / beatDur(b));
    if (b.pass) {
      if (f < 1) { const g = ease(clamp(f / 0.8)); return { xy: lerp(hand(p, holder, t), posAt(p, b.pass, t), g), flying: true, lift: (b.lob ? 0.9 : 0.35) * Math.sin(Math.PI * g) }; }
      holder = b.pass;
    }
    if (b.shot) {
      if (f < 1) { const g = ease(clamp(f / 0.85)); return { xy: lerp(hand(p, holder, t), RIM, g), flying: true, lift: 1.2 * Math.sin(Math.PI * g), shot: true }; }
      return { xy: RIM, made: true };
    }
  }
  const dribbling = p.beats.some((b, i) => b.m?.[holder]?.k === "drib" && t > s[i] && t < s[i] + beatDur(b));
  return { xy: hand(p, holder, t), holder, dribbling };
}
const hand = (p, id, t) => { const xy = posAt(p, id, t); return [xy[0] + 1.05, xy[1] - 0.95]; };
function beatIndex(p, t) { const s = starts(p); let i = -1; for (let k = 0; k < s.length; k++) if (t >= s[k]) i = k; return i; }

    if (b.trap && (f > 0.55 || ed)) { const c = posAt(p, b.trap.on, t); h += `<circle cx="${c[0]}" cy="${c[1]}" r="3.6" fill="#ef4444" fill-opacity=".22" stroke="#ef4444" stroke-width=".35" stroke-dasharray="1 .6"/>`; }
  }
  // players: offense blue, defense red (the side you're teaching is solid)
  const ids = Object.keys(p.at);
  for (const id of ids.filter((x) => x[0] === "O")) {
    const [x, y] = posAt(p, id, t), solid = !isD;
    h += `<g opacity="${solid ? 1 : 0.8}"><circle cx="${x}" cy="${y}" r="1.45" fill="#fff" stroke="#1e3a8a" stroke-width="${solid ? 0.4 : 0.25}"/><text x="${x}" y="${y + 0.55}" text-anchor="middle" font-size="1.55" font-weight="900" fill="#1e3a8a">${id.slice(1)}</text></g>`;
  }
  for (const id of ids.filter((x) => x[0] === "X")) {
    const [x, y] = posAt(p, id, t);
    h += `<g><circle cx="${x}" cy="${y}" r="1.45" fill="#b91c1c" stroke="#fff" stroke-width=".3"/><text x="${x}" y="${y + 0.5}" text-anchor="middle" font-size="1.25" font-weight="900" fill="#fff">X${id.slice(1)}</text></g>`;
  }
  // editing: the picked player, the line being dragged
  if (ed?.sel && p.at[ed.sel]) { const [x, y] = posAt(p, ed.sel, t); h += `<circle cx="${x}" cy="${y}" r="2.2" fill="none" stroke="#facc15" stroke-width=".4"/>`; }
  if (ed && bi >= 0) for (const id of p.beats[bi]?.trap?.by || []) { const [x, y] = posAt(p, id, t); h += `<circle cx="${x}" cy="${y}" r="1.95" fill="none" stroke="#ef4444" stroke-width=".3" stroke-dasharray=".6 .4"/>`; }

    h += `<g transform="translate(${ball.xy[0]} ${ball.xy[1] - (ball.lift || 0) * 1.6})"><circle r="${r}" fill="#f97316" stroke="#7c2d12" stroke-width=".14"/><path d="M${-r} 0 H${r} M0 ${-r} V${r}" stroke="#7c2d12" stroke-width=".1"/></g>`;
  }

  if (bi >= 0 && !ed) {

    for (let i = bi; i >= 0 && !lab; i--) { const b = p.beats[i], f = (t - s[i]) / beatDur(b); if (b.label && f > 0.6 && (i === bi || i === p.beats.length - 1)) lab = b.label; }
    if (lab) h += `<text x="0" y="39" text-anchor="middle" font-size="4.2" font-weight="900" fill="#fff" stroke="#111827" stroke-width=".35" paint-order="stroke" letter-spacing=".3">${lab}</text>`;

  $("#scrub").value = String(Math.round((t / duration(p)) * 1000));
  $("#time").textContent = `${t.toFixed(1)}s / ${duration(p).toFixed(1)}s`;
  $("#ov-play").hidden = !!ed || state.playing || t > 0.01;
  $("#btn-fs").hidden = !!ed;
  document.querySelectorAll("#steps [data-step]").forEach((b) => b.setAttribute("aria-current", String(+b.dataset.step === bi)));
}

// ---------------------------------------------------------------- make your own plays
// Edit a play step by step. "Start" = where everyone lines up and who has the ball.
// In a step: drag a player to where he goes (Move / Dribble / Screen), tap who gets the ball (Pass), tap the shooter (Shoot),
// tap two defenders to trap the ball (Trap). Everything saves for everyone with the link.
const uid = () => Math.random().toString(36).slice(2, 9);
const TOOLS = [["cut", "Move"], ["drib", "Dribble"], ["screen", "Screen"], ["pass", "Pass"], ["shoot", "Shoot"], ["trap", "Trap"]];
const HINTS = {
  start: "Drag players to where they line up. Tap a player, then “Give him the ball”.",
  cut: "Drag a player to where he cuts. Drag in a curve to bend the line.",
  drib: "Drag the player with the ball to where he dribbles.",
  screen: "Drag a player to where he sets the screen (the line ends in a bar).",
  pass: "Tap the player who gets the pass. Tap him again to take it back. Pass to a defender = a steal.",
  shoot: "Tap the player with the ball to shoot.",
  trap: "Tap two defenders to trap whoever has the ball.",

const FIVE_OUT = { O1: [0, 27], O2: [16, 21], O3: [-16, 21], O4: [20, 5], O5: [-20, 5] };

  return out;
}
function autoLabel(b) {

  const l = b.shot ? "SCORE!" : b.pass && b.pass[0] === "X" ? "STEAL!" : b.trap?.by?.length ? "TRAP!" : null;
  if (l) b.label = l; else delete b.label;

function pushUndo() { const p = cur(); state.edit.undo.push(JSON.stringify(p)); if (state.edit.undo.length > 60) state.edit.undo.shift(); }
function changed(p = cur(), full = true) { if (!p) return; sync.dirty.add(p.id); save(); if (full) { renderSide(); renderPlay(); } else draw(); }

function startEdit(step = 0) { const p = cur(); if (!p) return; setPlaying(false); state.edit = { step: Math.min(step, p.beats.length - 1), tool: "cut", sel: null, undo: [] }; renderPlay(); }

// dragging on the court
const svgEl = $("#court");
function toCourt(e) { const pt = svgEl.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const q = pt.matrixTransform(svgEl.getScreenCTM().inverse()); return [q.x, q.y]; }

  for (const id of Object.keys(p.at)) {
    const spots = [posAt(p, id, state.t)], m = b?.m?.[id]; if (m) spots.push(m.pts[m.pts.length - 1]); // where he starts this step, or where his line ends
    for (const q of spots) { const d = Math.hypot(q[0] - xy[0], q[1] - xy[1]); if (d < bd) { bd = d; best = id; } }
  }
  return best;
}
svgEl.addEventListener("pointerdown", (e) => {
  const p = cur(), ed = state.edit; if (!p || !ed) return;
  e.preventDefault();
  const xy = toCourt(e), id = hitPlayer(p, xy);
  if (!id) { ed.sel = null; renderEditbar(); draw(); return; }
  const from = posAt(p, id, state.t);
  drag = { id, from, cur: xy, trail: [from], moved: false }; svgEl.setPointerCapture(e.pointerId);
});
svgEl.addEventListener("pointermove", (e) => {
  if (!drag) return; const xy = toCourt(e); drag.cur = clampCourt(xy);
  if (!drag.moved && Math.hypot(xy[0] - drag.from[0], xy[1] - drag.from[1]) > 1) drag.moved = true;
  if (drag.moved) { const l = drag.trail[drag.trail.length - 1]; if (Math.hypot(xy[0] - l[0], xy[1] - l[1]) > 0.8) drag.trail.push(xy); draw(); }
});
function bendPts(trail, end) {
  const a = trail[0]; let far = null, fd = 0;
  const dx = end[0] - a[0], dy = end[1] - a[1], L = Math.hypot(dx, dy) || 1;
  for (const q of trail) { const d = Math.abs((q[0] - a[0]) * dy - (q[1] - a[1]) * dx) / L; if (d > fd) { fd = d; far = q; } }
  return fd > 2 ? [clampCourt(far), end] : [end];
}
function endDrag() {
  const d = drag; drag = null; if (!d) return;
  const p = cur(), ed = state.edit; if (!p || !ed) return;
  if (ed.step < 0) {
    if (d.moved) { pushUndo(); p.at[d.id] = d.cur; ed.sel = d.id; changed(p); }
    else { ed.sel = ed.sel === d.id ? null : d.id; renderEditbar(); draw(); }
    return;
  }
  const b = p.beats[ed.step]; b.m = b.m || {};
  const holder = holderAt(p, ed.step), isX = d.id[0] === "X";
  if (d.moved && ["cut", "drib", "screen", "pass", "shoot", "trap"].includes(ed.tool)) {
    pushUndo();
    let k = isX ? "slide" : ed.tool === "drib" || ed.tool === "screen" ? ed.tool : "cut";
    if (k === "drib" && d.id !== holder) k = "cut";
    b.m[d.id] = { k, pts: bendPts(d.trail, d.cur) }; ed.sel = d.id; changed(p); return;
  }
  // taps
  if (ed.tool === "pass") {
    if (!holder) { alert("Nobody has the ball in this step (it was shot)."); return; }
    if (d.id === holder) { ed.sel = d.id; renderEditbar(); draw(); return; }
    pushUndo(); if (b.pass === d.id) { delete b.pass; delete b.lob; } else { b.pass = d.id; delete b.shot; } autoLabel(b); changed(p); return;
  }
  if (ed.tool === "shoot") {
    if (d.id !== holder) { alert(holder ? `Only the player with the ball can shoot (${holder[0] === "X" ? holder : holder.slice(1)}).` : "Nobody has the ball in this step."); return; }
    pushUndo(); if (b.shot) delete b.shot; else { b.shot = true; delete b.pass; delete b.lob; } autoLabel(b); changed(p); return;
  }
  if (ed.tool === "trap") {
    if (!isX) { alert("Tap two defenders (the red ones) to trap the ball."); return; }
    if (!holder || holder[0] === "X") { alert("The other team has to have the ball to trap it."); return; }
    pushUndo(); const by = new Set(b.trap?.by || []); if (by.has(d.id)) by.delete(d.id); else { if (by.size >= 2) by.delete([...by][0]); by.add(d.id); }
    if (by.size) b.trap = { on: b.pass || holder, by: [...by] }; else delete b.trap; autoLabel(b); changed(p); return;
  }
  ed.sel = ed.sel === d.id ? null : d.id; renderEditbar(); draw();
}
svgEl.addEventListener("pointerup", endDrag);
svgEl.addEventListener("pointercancel", () => { drag = null; draw(); });

// ---------------------------------------------------------------- shared save (everyone with the link)
const API = "https://nxt-playbook-api.nxtplaybook.workers.dev";
const sync = { rev: null, local: false, timer: null, saving: false, dirty: new Set(), deleted: new Set(), pkgsDirty: false };
function setSync(text, tone = "") { const el = $("#sync"); el.textContent = text; el.dataset.tone = tone; }
function save() {
  store.set("hoops.book", book);
  if (sync.local) { setSync("Saved on this tablet", "warn"); return; }
  setSync("Saving…"); clearTimeout(sync.timer); sync.timer = setTimeout(push, 700);
}
async function push() {
  if (sync.saving) { sync.timer = setTimeout(push, 400); return; }
  sync.saving = true;
  try {
    const r = await fetch(API + "/hoops", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ book, base: sync.rev }) });
    if (r.status === 409) { const cur2 = await r.json(); mergeFrom(cur2.book); sync.rev = cur2.rev; sync.saving = false; return push(); }
    if (!r.ok) throw new Error(r.status);
    sync.rev = (await r.json()).rev; sync.dirty.clear(); sync.deleted.clear(); sync.pkgsDirty = false;
    setSync("All changes saved", "ok");
  } catch { setSync("Not saved yet: no connection. Keep going; it'll retry.", "warn"); sync.timer = setTimeout(push, 8000); }
  sync.saving = false;
}
/** Someone else saved first: take their book, then put my changes back on top. */
function mergeFrom(theirs) {
  const mine = new Map(book.plays.map((p) => [p.id, p]));
  const plays = (theirs.plays || []).filter((p) => !sync.deleted.has(p.id)).map((p) => (sync.dirty.has(p.id) && mine.has(p.id) ? mine.get(p.id) : p));
  for (const id of sync.dirty) if (mine.has(id) && !plays.some((p) => p.id === id)) plays.push(mine.get(id));
  const pkgs = theirs.pkgs || structuredClone(DEFAULT_PKGS);
  for (const side of ["O", "D"]) for (const k of book.pkgs[side]) if (!pkgs[side].some((x) => x.id === k.id)) pkgs[side].push(k);
  book = { ...theirs, plays, pkgs };
}
async function load() {
  try {
    const r = await fetch(API + "/hoops", { cache: "no-store" });
    if (r.status === 404) throw Object.assign(new Error("no hoops api"), { local: true });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json(); sync.rev = d.rev;
    if (d.book) book = d.book;
    else { const saved = store.get("hoops.book", null); if (saved?.plays) book = saved; sync.dirty = new Set(book.plays.map((p) => p.id)); save(); } // first time: put the starting plays on the server
    setSync("All changes saved", "ok");
  } catch (err) {
    sync.local = true; const saved = store.get("hoops.book", null); if (saved?.plays) book = saved;
    setSync(err.local ? "Saved on this tablet" : "Offline: changes stay on this tablet", "warn");
  }
}
async function poll() {
  if (sync.local || state.edit || sync.dirty.size || sync.saving || document.hidden) return;
  try { const r = await (await fetch(API + "/hoops/rev", { cache: "no-store" })).json(); if (r.rev && r.rev !== sync.rev) { const d = await (await fetch(API + "/hoops", { cache: "no-store" })).json(); if (d.book) { book = d.book; sync.rev = d.rev; store.set("hoops.book", book); renderSide(); renderPlay(); } } } catch {}
}
setInterval(poll, 15000);

// ---------------------------------------------------------------- import a play (photo or words -> Claude -> animated play)
const imp = { image: null, busy: false };
function impMsg(text, kind = "") { const el = $("#imp-msg"); el.textContent = text; el.className = "impmsg" + (kind ? " " + kind : ""); }
$("#btn-import").onclick = () => {
  if (state.edit) stopEdit();
  imp.image = null; $("#imp-file").value = ""; $("#imp-img").hidden = true; $("#imp-pick").hidden = false; $("#imp-sub").hidden = false; $("#imp-text").value = ""; impMsg("");
  $("#impdlg").showModal();
};
for (const id of ["#imp-x", "#imp-cancel"]) $(id).onclick = () => { if (!imp.busy) $("#impdlg").close(); };
/** Shrink the photo before sending it (phones take huge pictures). */
async function shrink(file) {
  const bmp = await createImageBitmap(file), k = Math.min(1, 1568 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  const url = c.toDataURL("image/jpeg", 0.85);
  return { url, image: { media_type: "image/jpeg", data: url.split(",")[1] } };
}
$("#imp-file").onchange = async (e) => {
  const f = e.target.files?.[0]; if (!f) return;
  try { const r = await shrink(f); imp.image = r.image; $("#imp-img").src = r.url; $("#imp-img").hidden = false; $("#imp-pick").hidden = true; $("#imp-sub").hidden = true; impMsg(""); }
  catch { impMsg("Couldn't open that picture. Try another one.", "err"); }
};
$("#imp-go").onclick = async () => {
  const text = $("#imp-text").value.trim();
  if (!imp.image && !text) { impMsg("Add a photo of the play or describe it.", "err"); return; }
  imp.busy = true; $("#imp-go").disabled = true; $("#imp-cancel").disabled = true;
  impMsg("Claude is reading your play… this takes about half a minute.", "busy");
  try {
    const r = await fetch(API + "/hoops/import", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ image: imp.image, text, side: state.side }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.play) throw new Error(d.error || (r.status === 404 ? "Import isn't switched on yet." : "Something went wrong. Try again."));
    const p = d.play; p.id = "h_" + uid();
    const pkgs = book.pkgs[p.side] || [];
    p.pkg = pkgs.some((k) => k.id === state.pkg) ? state.pkg : pkgs[0]?.id || null;
    book.plays.push(p); sync.dirty.add(p.id); save();
    $("#impdlg").close();
    state.side = p.side; store.set("hoops.side", p.side); if (p.pkg !== state.pkg) { state.pkg = p.pkg; store.set("hoops.pkg", p.pkg); }
    openPlay(p.id); toStage();
    setTimeout(() => setPlaying(true), 500); // bring it to life
  } catch (err) { impMsg(err.message, "err"); }
  imp.busy = false; $("#imp-go").disabled = false; $("#imp-cancel").disabled = false;
};
document.addEventListener("visibilitychange", poll);

(async () => {
  renderSide(); renderPlay();
  await load();
  if (!cur()) state.playId = listPlays()[0]?.id || null;
  else state.side = cur().side;
  renderSide(); renderPlay();
})();

</script>
</body>
